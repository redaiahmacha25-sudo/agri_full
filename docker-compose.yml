version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agriconnect_db
    environment:
      POSTGRES_DB: agriconnect
      POSTGRES_USER: agriconnect_user
      POSTGRES_PASSWORD: agriconnect_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriconnect_user -d agriconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriconnect_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: agriconnect_user
      DB_PASSWORD: agriconnect_pass
      DB_NAME: agriconnect
      JWT_SECRET: agriconnect_super_secret_jwt_key_2024
      PORT: 5000
      CORS_ORIGIN: http://localhost:5500
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    command: npm run dev

volumes:
  postgres_data:
    driver: local
